<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join | Login</title>
    <link rel="shortcut icon" href="../assets/icons/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/login-signup.css">
    <link rel="stylesheet" href="../styles/stakholder.css">
    <script src="../js/stakholder.js"></script>
</head>

<body>

    <img class="logo-stakholder" src="../assets/icons/Join-main-logo.png" alt="Join Logo">
    <header class="request__header">
        <a class="arrow-desktop" href="../index.html"><img class="arrow-img " src="../assets/icons/left-arrow.png"
                alt="back"></a>
        <p id="counter-text" class="request__counter"><span id="counter"></span> of 10 requests used Today</p>
    </header>
    <main class="request">
        <div class="headline-wrapper">
            <separator></separator>
            <h1 class="request__headline">Welcome</h1>
            <a class="arrow-mobile" href="../index.html"><img class="arrow-img " src="../assets/icons/left-arrow.png"
                    alt="back"></a>
        </div>

        <section class="request__content">
            <p id="counter-text-mobile" class="request__counter counter-mobile"><span id="counter-mobile"> </span>of 10
                requests used Today</p>
            <div class="request__wrapper">
                <div>
                    <h2 id="heading" class="request__headingtext">
                    </h2>
                    <p id="desc-text" class="request__explanation"></p>
                </div>

                <img id="board-img" class="request__img" src="../assets/icons/create-request.png" alt="kanbanboard image">
            </div>
            <a class="btn btn__request" href="mailto:dev.h.christopher@gmail.com">
                <span class="btn-desktop">Create Email Request</span>
                <span class="btn-mobile">Create Request</span>
                <img class="ceck-btn" src="../assets/icons/check-btn.png" alt="check">
            </a>
        </section>

    </main>
    <footer class="footer">
        <div class="footer-content">
            <a href="./privacy_policy.html">Privacy Policy</a>
            <a href="./legal_notice.html">Legal notice</a>
        </div>
    </footer>
</body>

</html>
